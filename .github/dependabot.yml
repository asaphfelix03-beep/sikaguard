version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The bundled model is serialized with scikit-learn 1.8: a new minor version
      # requires retraining and re-evaluating, which is done by hand.
      - dependency-name: scikit-learn
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
