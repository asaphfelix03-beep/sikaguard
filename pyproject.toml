[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sikaguard"
version = "0.1.0.dev0"
description = "Explainable detection of French-language SMS and Mobile Money scams (West Africa)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ojewumi Asaph Felix" }]
requires-python = ">=3.10"
keywords = ["scam", "fraud", "sms", "smishing", "mobile-money", "security", "nlp", "french", "africa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.4,<1.9",
    "skops>=0.10",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
demo = ["gradio>=4.0"]
lab = ["matplotlib>=3.7"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "pip-audit>=2.7",
]

[project.scripts]
sikaguard = "sikaguard.cli:main"

[project.urls]
Homepage = "https://github.com/asaphfelix03-beep/sikaguard"
Issues = "https://github.com/asaphfelix03-beep/sikaguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sikaguard"]

[tool.hatch.build.targets.sdist]
include = ["src/sikaguard", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.coverage.run]
source = ["sikaguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # French text and deliberate homoglyph tables

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S311"]
"src/sikaguard_lab/**" = ["S311"]

[tool.mypy]
python_version = "3.12"  # numpy>=2.3 stubs need 3.12 syntax; runtime 3.10 is covered by CI
strict = true
files = ["src/sikaguard"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "skops.*", "scipy.*"]
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
